name: security

# Shift-left: every gate runs on every PR, before merge. Nothing reaches main
# without passing. The expensive/noisy scans also run nightly against main so
# newly-published CVEs in already-merged code get caught
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab
  pull-requests: write

jobs:

  # -- GATE 1
  # Secrets. Runs first and fastest: leaked credentials is the one finding
  # where the clock is already running, so we want to know in <30s.
  secrets:
    name: Gate 1 - secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history - a secret deleted in the latest
                           # commit is still in the history, and still leaked
      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
              --redact \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --exit-code=1
      - name: Upload SARIF
        if: always()                          # upload especially when the scan fails
        uses: github/codeql-action/upload-sarif@v4   # think about replacing this with version digest
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # -- GATE 2 
    # SAST. Reads the source for dangerous patterns without executing it.
    # Fast and deterministic, but structurally blind to anything that only
    # manifests at runtime - another gate will address this hole
  sast:
    name: Gate 2 - SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5        # v5
        with:
          persist-credentials: false

      - name: Test custom Semgrep rules
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep --test .semgrep/

      - name: Semgrep
        run: |
          set -euo pipefail
          IMAGE="semgrep/semgrep:latest"   # maybe select specific digest
          echo "Scanning with: $IMAGE"
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            semgrep scan \
              --config p/security-audit \
              --config p/python \
              --config p/flask \
              --config .semgrep/custom-rules.yml \
              --sarif --output semgrep.sarif \
              --error app/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4   # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # -- GATE 3
  # Checks Python dependencies for published vulnerabilities that may have been missed
  dependencies:
    name: Gate 3 - Dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: |
          python -m pip_audit --version
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --desc \
            --aliases \
            --progress-spinner off
  
    # -- GATE 4
  container:
    name: Gate 4 - Container security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build container
        id: build
        run: docker build --pull --tag notes-api:ci .

      - name: Check container startup
        run: |
          set -euo pipefail

          docker run -d --name notes-api \
            -p 127.0.0.1:8000:8000 \
            -e NOTES_API_KEY=ci-test-only \
            notes-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          exit 1

      - name: Inspect runtime user and Git metadata
        run: |
          docker exec notes-api id
          docker exec notes-api sh -c 'test ! -e /app/.git'

      - name: Scan Dockerfile configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /src/Dockerfile

      - name: Scan image vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker save notes-api:ci -o "$RUNNER_TEMP/notes-api.tar"

          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            "$TRIVY_IMAGE" image \
            --input /scan/notes-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs notes-api || true
          docker rm -f notes-api || true
