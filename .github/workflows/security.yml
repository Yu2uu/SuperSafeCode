name: security

# Gates run on PRs, main pushes, and nightly. Configure required checks in
# repository rules to enforce merge blocking; workflow failures alone do not.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab
  pull-requests: write

jobs:

  # -- GATE 1
  # Secrets. Runs first and fastest: leaked credentials is the one finding
  # where the clock is already running, so we want to know in <30s.
  secrets:
    name: Gate 1 - secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history - a secret deleted in the latest
                           # commit is still in the history, and still leaked
      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo \
              --redact \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --exit-code=1
      - name: Upload SARIF
        if: always()                          # upload especially when the scan fails
        uses: github/codeql-action/upload-sarif@v4   # think about replacing this with version digest
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # -- GATE 2 
    # SAST. Reads the source for dangerous patterns without executing it.
    # Fast and deterministic, but structurally blind to anything that only
    # manifests at runtime - another gate will address this hole
  sast:
    name: Gate 2 - SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5        # v5
        with:
          persist-credentials: false

      - name: Test custom Semgrep rules
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep --test .semgrep/

      - name: Semgrep
        run: |
          set -euo pipefail
          IMAGE="semgrep/semgrep:latest"   # maybe select specific digest
          echo "Scanning with: $IMAGE"
          docker run --rm -v "$PWD:/src" -w /src "$IMAGE" \
            semgrep scan \
              --config p/security-audit \
              --config p/python \
              --config p/flask \
              --config .semgrep/custom-rules.yml \
              --sarif --output semgrep.sarif \
              --error app/

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4   # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # -- GATE 3
  # Checks Python dependencies for published vulnerabilities that may have been missed
  dependencies:
    name: Gate 3 - Dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: |
          python -m pip_audit --version
          python -m pip_audit \
            --requirement requirements.txt \
            --strict \
            --desc \
            --aliases \
            --progress-spinner off
  
    # -- GATE 4
  container:
    name: Gate 4 - Container security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build container
        id: build
        run: docker build --pull --tag notes-api:ci .

      - name: Check container startup
        run: |
          set -euo pipefail

          docker run -d --name notes-api \
            -p 127.0.0.1:8000:8000 \
            -e NOTES_API_KEY=ci-test-only \
            notes-api:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          exit 1

      - name: Verify non-root runtime and Git exclusion
        run: |
          set -euo pipefail
          docker exec notes-api id
          docker exec notes-api sh -c 'test "$(id -u)" -ne 0'
          docker exec notes-api sh -c 'test ! -e /app/.git'

      - name: Inspect remaining vulnerability applicability
        run: |
          docker exec notes-api sh -ec '
            echo "Verify unnecessary executables are absent:"
            for tool in mount infocmp nsenter; do
              if command -v "$tool"; then
                echo "FAIL: unexpected executable remains: $tool"
                exit 1
              fi
            done

            echo "Process privilege settings:"
            grep -E "^(Uid|Gid|CapEff|CapBnd|NoNewPrivs):" /proc/1/status

            echo "Targeted component search:"
            find /usr /lib \
              \( -name systemd-homed -o -path "*/Archive/Tar.pm" \) \
              -print

            echo "Verify components underlying proposed exceptions are absent:"
            matches=$(find /usr /lib \
              \( -name systemd-homed -o -path "*/Archive/Tar.pm" \) \
              -print)

            if [ -n "$matches" ]; then
              printf "%s\n" "$matches"
              echo "FAIL: an affected component is present; review the exceptions"
              exit 1
            fi

            echo "PASS: neither affected component was found"

          '

      - name: Scan Dockerfile configuration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /src/Dockerfile

      - name: Scan image vulnerabilities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker save notes-api:ci -o "$RUNNER_TEMP/notes-api.tar"

          docker run --rm \
            -v "$RUNNER_TEMP:/scan:ro" \
            -v "$PWD/.trivyignore.yaml:/config/.trivyignore.yaml:ro" \
            "$TRIVY_IMAGE" image \
            --input /scan/notes-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignorefile /config/.trivyignore.yaml \
            --show-suppressed \
            --exit-code 1

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs notes-api || true
          docker rm -f notes-api || true

  security_tests:
    name: Gate 6 - Security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test security properties
        run: python -m unittest discover -s tests -v
      - name: Prove tests reject reintroduced weaknesses
        run: python scripts/verify_security_controls.py

  runtime:
    name: Gate 5 - Runtime security (ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NOTES_API_KEY: ci-runtime-test-only
      NOTES_TEST_URL: http://127.0.0.1:8000
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and start API
        run: |
          set -euo pipefail
          docker build --pull -t notes-runtime:ci .
          docker run -d --name notes-runtime \
            -p 127.0.0.1:8000:8000 \
            -e NOTES_API_KEY notes-runtime:ci
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 1 \
            --retry-max-time 60 --max-time 5 \
            http://127.0.0.1:8000/healthz
      - name: Test security properties over HTTP
        run: python -m unittest discover -s tests -v
      - name: Prove ZAP blocks a missing security header
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap-reports"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap-reports/rules.tsv"
          # ZAP writes reports as its container user; this directory has only reports.
          chmod 777 "$RUNNER_TEMP/zap-reports"
          docker pull "$ZAP_IMAGE"
          docker image inspect "$ZAP_IMAGE" --format '{{json .RepoDigests}}'
          python scripts/zap_negative_control.py > "$RUNNER_TEMP/zap-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error \
            --retry 15 --retry-connrefused --retry-delay 1 --max-time 5 \
            http://127.0.0.1:8001/healthz
          status=0
          docker run --rm --network host \
            -v "$RUNNER_TEMP/zap-reports:/zap/wrk:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:8001/healthz -m 1 -T 5 \
            -c rules.tsv -I -J negative.json -r negative.html || status=$?
          test "$status" -eq 1
          python scripts/check_zap_control.py "$RUNNER_TEMP/zap-reports/negative.json"
      - name: Scan API responses with ZAP
        run: |
          docker run --rm --network host \
            -v "$RUNNER_TEMP/zap-reports:/zap/wrk:rw" \
            "$ZAP_IMAGE" zap-baseline.py \
            -t http://127.0.0.1:8000/healthz -m 1 -T 5 \
            -c rules.tsv -I -J application.json -r application.html
      - name: Preserve runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-security-reports
          path: |
            ${{ runner.temp }}/zap-reports/
            ${{ runner.temp }}/zap-fixture.log
          if-no-files-found: warn
          retention-days: 14
      - name: Runtime logs and cleanup
        if: always()
        run: |
          docker logs notes-runtime || true
          docker rm -f notes-runtime || true
