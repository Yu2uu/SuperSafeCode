    expired_at: 2026-11-05
    statement: >-
      Reviewed 2026-10-05. Residual-risk acceptance: libacl remains vulnerable. The reviewed notes API has no identified privileged ACL operation on attacker-controlled paths and runs as UID 10001. Non-root execution reduces exposure but does not prove that exploitation is impossible.
      Scope: local and CI portfolio use only; no live deployment.
      Reassess before deployment or changes to image contents, application
      behaviour, or runtime privileges. Owner: repository maintainer.
